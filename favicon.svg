<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="lightning-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#5df75a" />
      <stop offset="100%" stop-color="#2AF527" />
    </linearGradient>
  </defs>

  <!-- Black Background with subtle rounded corners -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#2AF527" stroke-width="0.8" opacity="0.4" />

  <!-- Letter A made of electric lightning bolts -->
  <g filter="url(#lightning-glow)">
    <!-- Left jagged lightning leg -->
    <polyline points="32,7 29,19 32,20 23,37 26,38 15,57 21,55 18,52" 
              fill="none" stroke="#2AF527" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" />
    <polyline points="32,7 29,19 32,20 23,37 26,38 15,57" 
              fill="none" stroke="url(#bolt-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="miter" />

    <!-- Right jagged lightning leg -->
    <polyline points="32,7 35,19 32,20 41,37 38,38 49,57 43,55 46,52" 
              fill="none" stroke="#2AF527" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" />
    <polyline points="32,7 35,19 32,20 41,37 38,38 49,57" 
              fill="none" stroke="url(#bolt-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="miter" />

    <!-- Horizontal jagged lightning crossbar -->
    <polyline points="23,38 28,35 34,41 41,37" 
              fill="none" stroke="#2AF527" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" />
    <polyline points="23,38 28,35 34,41 41,37" 
              fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="miter" />

    <!-- Electric sparks radiating off the apex and feet -->
    <line x1="32" y1="7" x2="32" y2="3" stroke="#2AF527" stroke-width="1.5" stroke-linecap="round" />
    <line x1="15" y1="57" x2="11" y2="60" stroke="#2AF527" stroke-width="1.5" stroke-linecap="round" />
    <line x1="49" y1="57" x2="53" y2="60" stroke="#2AF527" stroke-width="1.5" stroke-linecap="round" />
    <line x1="28" y1="35" x2="26" y2="30" stroke="#5df75a" stroke-width="1" stroke-linecap="round" />
    <line x1="34" y1="41" x2="36" y2="46" stroke="#5df75a" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>